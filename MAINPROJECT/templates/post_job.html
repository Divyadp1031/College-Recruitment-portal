<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <i class="fas fa-graduation-cap"></i>
                <span>College Recruitment Portal</span>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/dashboard-company">Dashboard</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-container">
        <div class="form-box">
            <h2>Post a New Job</h2>
            <form method="post" class="registration-form">
                <div class="form-group">
                    <label>Job Title *</label>
                    <input type="text" name="job_title" placeholder="e.g., Software Developer" required>
                </div>

                <div class="form-group">
                    <label>Role *</label>
                    <input type="text" name="role" placeholder="e.g., Developer, Analyst" required>
                </div>

                <div class="form-group">
                    <label>Job Description *</label>
                    <textarea name="description" rows="5" placeholder="Describe the job responsibilities..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Skills Required *</label>
                    <input type="text" name="skills_required" placeholder="e.g., Python, Django, SQL" required>
                </div>

                <div class="form-group">
                    <label>Minimum CGPA *</label>
                    <input type="number" name="min_cgpa" step="0.01" min="0" max="10" required>
                </div>

                <div class="form-group">
                    <label>Department *</label>
                    <input type="text" name="department" placeholder="e.g., Computer Science" required>
                </div>

                <div class="form-group">
                    <label>Experience Level *</label>
                    <select name="experience_level" required>
                        <option value="">Select Experience Level</option>
                        <option value="Fresher">Fresher</option>
                        <option value="0-1">0-1 Years</option>
                        <option value="1-3">1-3 Years</option>
                        <option value="3+">3+ Years</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Job Type *</label>
                    <select name="job_type" required>
                        <option value="">Select Job Type</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Internship">Internship</option>
                        <option value="Contract">Contract</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Location *</label>
                    <input type="text" name="location" placeholder="e.g., Bangalore, India" required>
                </div>

                <div class="form-group">
                    <label>Salary Range (Min)</label>
                    <input type="number" name="salary_min" placeholder="Optional" step="0.01">
                </div>

                <div class="form-group">
                    <label>Salary Range (Max)</label>
                    <input type="number" name="salary_max" placeholder="Optional" step="0.01">
                </div>

                <button type="submit" class="btn btn-primary">Post Job</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 College Recruitment Portal. All rights reserved.</p>
    </footer>
</body>
</html>
</body>
</html>
